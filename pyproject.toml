[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-llm"
version = "0.1.0"
description = "Kairos — LLM gateway with workload-aware model routing, cost accounting and retries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "aiohttp>=3.14.4,<4",
    "kairos-core>=0.3,<0.4",
    "openai>=2.45,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
qualification = ["kairos-persistence>=0.1,<0.2"]
campaign = ["kairos-persistence>=0.1,<0.2", "kairos-router>=0.2,<0.3", "kairos-strategy-engine>=0.2,<0.3"]

[project.scripts]
kairos-llm-qualify = "kairos_llm.qualification:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "kairos-persistence>=0.1,<0.2",
    "kairos-router>=0.2,<0.3",
    "kairos-strategy-engine>=0.2,<0.3",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"
# Bind the maintained runtime dependencies without rewriting the frozen strategy source.
override-dependencies = [
    "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@37165e3078b53364513f876f4243357ba19a19ba",
    "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@2d88a351fc045de5b58bbf6acae209341096a850",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "37165e3078b53364513f876f4243357ba19a19ba" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "2d88a351fc045de5b58bbf6acae209341096a850" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "604828c53a7f24c8ade8b2f4c3b1cb773016c3c2" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "79020570cd1218152b4b8fe2195739a8e63b9c28" }

[tool.hatch.build.targets.wheel]
packages = ["kairos_llm"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
