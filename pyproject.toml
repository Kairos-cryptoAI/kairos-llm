[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-llm"
version = "0.1.0"
description = "Kairos — LLM gateway with effort-based model routing, cost accounting and retries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.1.0",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["kairos_llm"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
