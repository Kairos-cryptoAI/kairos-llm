[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-llm"
version = "0.1.0"
description = "Kairos — LLM gateway with workload-aware model routing, cost accounting and retries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "aiohttp>=3.10,<4",
    "kairos-core>=0.3,<0.4",
    "openai>=2.45,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
qualification = ["kairos-persistence>=0.1,<0.2"]
campaign = ["kairos-persistence>=0.1,<0.2", "kairos-router>=0.2,<0.3", "kairos-strategy-engine>=0.2,<0.3"]

[project.scripts]
kairos-llm-qualify = "kairos_llm.qualification:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "kairos-persistence>=0.1,<0.2",
    "kairos-router>=0.2,<0.3",
    "kairos-strategy-engine>=0.2,<0.3",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "6937eb4773fc00afaf5ba4e020b28b689f48e377" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "fd2966761e84b32688c9aee73e00604965f5d7f2" }
kairos-router = { git = "https://github.com/Kairos-cryptoAI/kairos-router.git", rev = "cd2af6e9f3516b2a18dfb022210a70b7084c1840" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "ccf1ff189b3c84e058c617512d92487006a58206" }

[tool.hatch.build.targets.wheel]
packages = ["kairos_llm"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
